<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>European Union - 2013 - Regulation (EU) No 524_2013 - ODR for consumer disputes | JurisLib</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+Pro:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Robust PDF.js Initialization
    window.onload = function() {
       if (window.pdfjsLib) {
         window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
       }
    };
  </script>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
    <i data-lucide="moon" id="theme-icon"></i>
  </button>

  <div class="layout">
    <div class="main-container">
      <aside class="sidebar">
        <div style="margin-bottom: 2rem;">
          <h2 style="margin:0; font-family: 'Source Serif Pro', serif;">JurisLib</h2>
          <p style="margin:0; font-size: 0.85rem; color: var(--text-secondary);">Acervo Jurídico Digital</p>
        </div>
        
        <!-- Curator Info -->
        <div class="curator-card">
          <div class="curator-text">
            <strong>Curadoria do conteúdo</strong><br/>
            Luiz Peixoto de Siqueira Filho<br/>
            <span style="font-size:0.75rem; opacity:0.8">OABRJ 94719</span>
          </div>
        </div>

        <div class="search-container">
           <label style="font-size: 0.7rem; font-weight:bold; color:var(--text-secondary); text-transform:uppercase;">Filtrar Acervo</label>
           <input type="text" id="search" onkeyup="filterList()" placeholder="Buscar por título..." class="search-input">
        </div>

        <nav>
          <ul style="list-style: none; padding: 0;">
            <li style="margin-bottom: 0.5rem;"><a href="../index.html" class="btn-outline" style="border:none; padding:0; display:flex; gap:0.5rem;"><i data-lucide="home" size="16"></i> Início</a></li>
          </ul>
        </nav>

        <footer class="footer">
          <p>&copy; 2025 JurisLib</p>
        </footer>
      </aside>

      <main class="content">
        
      <div class="item-header">
        <a href="../index.html" style="font-size: 0.9rem; display:flex; align-items:center; gap:0.5rem; margin-bottom:1rem;">
          <i data-lucide="arrow-left" size="16"></i> Voltar para o índice
        </a>
        <h1 style="margin-top: 0.5rem; line-height: 1.2;">European Union - 2013 - Regulation (EU) No 524_2013 - ODR for consumer disputes</h1>
        
        <div style="margin-top: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap;">
           <button onclick="copyCitation('AUTOR DESCONHECIDO. **European Union - 2013 - Regulation (EU) No 524_2013 - ODR for consumer disputes**. Acesso em: 25/11/2025.')" class="btn">
             <i data-lucide="quote" size="16"></i> Copiar Citação (ABNT)
           </button>
           
        </div>
      </div>
      
      <div class="item-meta-grid">
        <div><div class="label">Data</div><div>-</div></div>
        <div><div class="label">Autores</div><div>-</div></div>
        <div><div class="label">Publicação</div><div>-</div></div>
      </div>

      

      
    
      </main>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    // Dark Mode Logic
    function toggleTheme() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateIcon();
    }
    
    function updateIcon() {
      const icon = document.getElementById('theme-icon');
      if(document.body.classList.contains('dark')) {
        icon.setAttribute('data-lucide', 'sun');
      } else {
        icon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
    }

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') document.body.classList.add('dark');
    updateIcon();

    // Search Logic
    function filterList() {
      const input = document.getElementById('search');
      if(!input) return; // Only on index
      const filter = input.value.toLowerCase();
      const cards = document.getElementsByClassName('card');
      for (let i = 0; i < cards.length; i++) {
        const title = cards[i].querySelector('h3').innerText;
        if (title.toLowerCase().indexOf(filter) > -1) {
          cards[i].parentElement.style.display = "";
        } else {
          cards[i].parentElement.style.display = "none";
        }
      }
    }

    // Citation Logic
    function copyCitation(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Referência ABNT copiada para a área de transferência!');
      });
    }

    
  </script>
</body>
</html>
